worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # Hide the nginx version banner (Server header + default error pages).
    server_tokens off;

    # Prefer inbound X-Request-ID; otherwise use nginx's own $request_id.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Correlation-friendly access log (req_id ties nginx logs to app logs).
    log_format main '$remote_addr - [$time_local] "$request" '
                     'status=$status bytes=$body_bytes_sent req_id=$req_id '
                     'rt=$request_time upstream_rt=$upstream_response_time '
                     '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # Basic per-IP rate limit for the public edge.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream api_upstream {
        server api:8080;
    }

    # Plain HTTP. Not redirected to HTTPS: Compose publishes both ports as
    # non-standard host ports for local assessment (see NGINX.md / decisions.md D-012).
    # In production behind standard 80/443 this block would 301 to https://$host$request_uri.
    server {
        listen 80;
        server_name _;

        include /etc/nginx/snippets/proxy.conf;
    }

    # TLS edge. Self-signed cert generated by `make certs` for local assessment.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        include /etc/nginx/snippets/proxy.conf;
    }
}
